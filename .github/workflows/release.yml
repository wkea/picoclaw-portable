name: release

# 打 tag 即自动构建安装包并附到 Release（如 v1.0.0）
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建轻量包（不含二进制，约 40KB）
        env:
          REPACKAGE: '1'
        run: bash build-portable.sh

      - name: 构建离线包（内嵌 linux-x86_64 二进制）
        env:
          REPACKAGE: '1'
          BUNDLE_BIN: '1'
        run: |
          mv dist/picoclaw-portable.tar.gz dist/_light.tar.gz
          bash build-portable.sh
          mv dist/picoclaw-portable.tar.gz dist/picoclaw-portable-offline-x86_64.tar.gz
          mv dist/_light.tar.gz          dist/picoclaw-portable.tar.gz

      - name: 校验产物 + 安全检查
        run: |
          ls -lh dist/
          # 产物内绝不能含密钥文件
          for f in dist/*.tar.gz; do
            if tar tzf "$f" | grep -q 'security\.yml'; then
              echo "::error::$f 内含 security.yml，已中止"; exit 1
            fi
          done
          echo "OK: 产物干净"
          tar tzf dist/picoclaw-portable.tar.gz | head -10

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/picoclaw-portable.tar.gz
            dist/picoclaw-portable-offline-x86_64.tar.gz
          generate_release_notes: true
          body: |
            ## 安装

            ```bash
            # 轻量包（安装时在线下载二进制）
            tar xzf picoclaw-portable.tar.gz && cd picoclaw-portable && bash install.sh

            # 离线包（内嵌 linux-x86_64 二进制，无需外网）
            tar xzf picoclaw-portable-offline-x86_64.tar.gz && cd picoclaw-portable && bash install.sh
            ```

            安装向导会依次询问：**API Key** → **选模型**（默认 deepseek-flash），
            装完输入 `niko` 即进入聊天。

            > 包内**不含**任何明文密钥。
